const facts=raw.map(x=>x.split('\n').map(y=>y.split('|')));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);let bank=[];function add(s,t,a,w,c){let o=shuffle([a,...w]);bank.push({id:bank.length,s,t,o,a:o.indexOf(a),c})}facts.forEach((f,s)=>{if(s===2)return;let n=s===0?10:5;f.forEach(([d,a,c],i)=>{for(let k=0;k<n;k++){let rev=k%2,other=f.filter((_,j)=>i!==j),v=shuffle(other).slice(0,4);add(s,rev?`Qual descrição corresponde a ${a}?`:`${['Identifique','Associe','Reconheça','Classifique','Indique'][Math.floor(k/2)]}: ${d}`,rev?d:a,v.map(x=>x[rev?0:1]),c)}})});for(let i=0;i<50;i++){let n=i+3,a=n*4,b=n*3,c=n,r=a+b-c;add(2,`Em uma turma, ${a} estudam Português, ${b} Lógica e ${c} ambas. Quantos estudam pelo menos uma?`,String(r),[r-1,r+1,a+b,a+b+c].map(String),`${a}+${b}−${c}=${r}. Subtraia a interseção para não contar duas vezes.`)}
const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];let st={h:[1,1,1,1,1,1,0],plan:[60,60,60,60,60,60,0],actual:[0,0,0,0,0,0,0],status:Array(7).fill('future'),done:{},logs:[],carry:[],schedule:null};try{Object.assign(st,JSON.parse(localStorage.getItem('prf4')||'{}'))}catch{}function save(){try{localStorage.setItem('prf4',JSON.stringify(st))}catch{}}let tab=0,s=0,k=0,level=0,flip=false,answer=null,exam=null,result=null,miss=false;const tabs=['Início','Cronograma','Aulas','Flashcards','Questões','Simulado','Erros','Backup'];const view=document.querySelector('#view');const btn=(t,code,cl='')=>`<button class="${cl}" onclick="${code}">${t}</button>`;const sel=()=>`<select onchange="s=+this.value;k=0;answer=null;flip=false;render()">${names.map((n,i)=>`<option value=${i} ${i===s?'selected':''}>${n}</option>`).join('')}</select>`;const sum=a=>a.reduce((x,y)=>x+y,0);function replan(){let queue=st.carry.slice(),cycle=[0,2,4,3,0,5,6,7,8,1],j=0;let orig=st.plan.map(m=>{let a=[];while(m>0){let t=Math.min(m,30);a.push({s:cycle[j++%cycle.length],m:t});m-=t}return a});orig.forEach((a,i)=>{if(st.status[i]==='future')return;let n=st.status[i]==='missed'?0:st.actual[i];a.forEach(b=>{let t=Math.min(n,b.m);n-=t;if(b.m>t)queue.push({...b,m:b.m-t})})});orig.forEach((a,i)=>{if(st.status[i]==='future')queue.push(...a)});st.schedule=days.map((_,i)=>{let a=[],cap=st.status[i]==='future'?Math.round(st.h[i]*60):0;while(cap&&queue.length){let b=queue[0],m=Math.min(cap,b.m);a.push({...b,m});cap-=m;queue[0]={...b,m:b.m-m};if(!queue[0].m)queue.shift()}return a});st.remaining=queue;save();render()}
function record(q,a){st.logs.push({id:q.id,s:q.s,ok:q.a===a});save()}function pool(){return bank.filter(q=>q.s===s&&(!miss||st.logs.filter(l=>l.id===q.id).at(-1)?.ok===false))}function choices(q,a,ex){return q.o.map((o,i)=>btn('ABCDE'[i]+') '+o,ex?`exam.a[exam.pos]=${i};render()`:`respond(${i})`,'choice '+(ex?(a===i?'active':''):a===null?'':i===q.a?'good':i===a?'bad':''))).join('')}function respond(i){if(answer!==null)return;let q=pool()[k];answer=i;record(q,i);if(miss&&i===q.a){miss=false;k=pool().findIndex(x=>x.id===q.id)}render()}function start(){let q=names.flatMap((_,i)=>shuffle(bank.filter(x=>x.s===i)).slice(0,i===0?12:6));exam={q,a:q.map(()=>null),pos:0,start:Date.now()};result=null;render()}function finish(){if(!confirm('Entregar simulado?'))return;result=exam;exam.q.forEach((q,i)=>record(q,exam.a[i]));exam=null;render()}
function render(){document.querySelector('#nav').innerHTML=tabs.map((t,i)=>btn(t,`tab=${i};k=0;answer=null;miss=${i===6};render()`,tab===i?'active':'')).join('');let h='';if(tab===0)h=`<section><h2>Seu progresso</h2><p>${sum(st.h)} horas semanais · ${bank.length} exercícios gerados</p><p>${st.logs.length} respostas · ${st.logs.length?Math.round(st.logs.filter(x=>x.ok).length/st.logs.length*100):0}% de acertos</p>${btn('Estudar agora','tab=2;render()','primary')} ${btn('Replanejar','tab=1;render()')}</section><section><h3>Desempenho</h3>${names.map((n,i)=>{let l=st.logs.filter(x=>x.s===i);return `<p>${n}: ${l.filter(x=>x.ok).length}/${l.length}</p><progress max=1 value=${l.length?l.filter(x=>x.ok).length/l.length:0}></progress>`}).join('')}</section>`;if(tab===1)h=`<section><h2>Disponibilidade e frequência</h2>${days.map((d,i)=>`<div class=row><b>${d}</b><label>Horas <input type=number min=0 max=16 step=.25 value=${st.h[i]} onchange="st.h[${i}]=Math.max(0,Math.min(16,+this.value||0));save()"></label><select onchange="st.status[${i}]=this.value;if(this.value==='done')st.actual[${i}]=st.plan[${i}];save();render()">${[['future','A estudar'],['done','Concluído'],['partial','Parcial'],['missed','Não estudei']].map(([v,t])=>`<option value=${v} ${st.status[i]===v?'selected':''}>${t}</option>`).join('')}</select>${['done','partial'].includes(st.status[i])?`<label>Minutos estudados <input type=number min=0 value=${st.actual[i]} onchange="st.actual[${i}]=Math.max(0,+this.value||0);save()"></label>`:''}</div>`).join('')}<p>${btn('↻ Replanejar estudos','replan()','primary')}</p>${btn('Definir nova meta semanal','if(confirm(\'Alterar meta original para as horas disponíveis?\')){st.plan=st.h.map(h=>Math.round(h*60));replan()}')}</section>${st.schedule?`<section><h3>Plano recalculado</h3>${days.map((d,i)=>`<h4>${d}</h4>${st.schedule[i].map(b=>`<div class=row>${names[b.s]} <b>${b.m} min</b></div>`).join('')||'Sem atividades futuras'}`).join('')}<p>Pendência: ${sum((st.remaining||[]).map(b=>b.m))} min</p></section>`:''}`;if(tab===2){let f=facts[s][k%facts[s].length];h=`<section><h2>Aulas e resumos</h2>${sel()}<p><select onchange="k=+this.value;render()">${facts[s].map((x,i)=>`<option value=${i} ${k===i?'selected':''}>${x[0]}</option>`).join('')}</select></p>${['Básico','Intermediário','Avançado'].map((x,i)=>btn(x,`level=${i};render()`,level===i?'active':'')).join(' ')}<h3>${f[0]}</h3><p><b>${f[1]}</b> — ${f[2]}</p><p>${['Identifique o conceito e explique com suas palavras.','Compare este conceito com os demais da disciplina e resolva exercícios de fixação.','Aplique o conceito a questões contextualizadas e confira as exceções nas fontes oficiais.'][level]}</p>${btn(st.done[s+'-'+k+'-'+level]?'Concluído ✓':'Concluir etapa',`st.done['${s}-${k}-${level}']=true;save();render()`)}<h3>Materiais complementares</h3><p><a target=_blank href="https://www.youtube.com/results?search_query=${encodeURIComponent(names[s]+' '+f[0]+' concurso aula completa')}">Buscar videoaulas</a></p><p><a target=_blank href="https://www.google.com/search?q=${encodeURIComponent(names[s]+' '+f[0]+' apostila PDF site:gov.br')}">Buscar apostilas públicas</a></p><p><a href="https://www.escolavirtual.gov.br/catalogo">Escola Virtual de Governo</a></p><small>Etapas compactas, não aulas extensivas. Links de busca não são curadoria individual.</small></section>`}if(tab===3){let f=facts[s][k%facts[s].length];h=`<section><h2>Flashcards</h2>${sel()}<p>${k+1}/${facts[s].length}</p><button style="width:100%;min-height:150px;font-size:22px" onclick="flip=!flip;render()">${flip?f[1]+' — '+f[2]:f[0]}<br><small>Toque para virar</small></button><p>${btn('Próximo',`k=(k+1)%facts[s].length;flip=false;render()`)}</p></section>`}if(tab===4||tab===6){let p=pool(),q=p[k];h=`<section><h2>${miss?'Caderno de erros':'Questões comentadas'}</h2>${sel()}<p>${p.length} exercícios disponíveis</p>${q?`<small>${k+1}/${p.length}</small><h3>${q.t}</h3>${choices(q,answer,false)}${answer!==null?`<p><b>${answer===q.a?'Correto!':'Resposta correta: '+q.o[q.a]}</b><br>${q.c}</p>`:''}${btn('Próxima',`k=(k+1)%${p.length};answer=null;render()`,'primary')}`:'Nenhum exercício neste filtro.'}</section>`}if(tab===5){h='<section><h2>Simulado de 60 questões</h2>';if(!exam&&!result)h+=`<p>Modelo provisório: 12 de Português e 6 de cada outra disciplina. Confira a distribuição oficial antes de usar como réplica da prova.</p>${btn('Iniciar','start()','primary')}`;if(exam){let q=exam.q[exam.pos];h+=`<p>${exam.pos+1}/60 · ${names[q.s]}</p><h3>${q.t}</h3>${choices(q,exam.a[exam.pos],true)}${btn('Anterior','exam.pos=Math.max(0,exam.pos-1);render()')} ${btn('Próxima','exam.pos=Math.min(59,exam.pos+1);render()')}<p>${exam.a.map((a,i)=>btn(i+1,`exam.pos=${i};render()`,a!==null?'active':'')).join(' ')}</p>${btn('Entregar','finish()','primary')}`}if(result){let a=result.q.filter((q,i)=>q.a===result.a[i]).length;h+=`<h3>${a}/60 acertos</h3>${result.q.map((q,i)=>`<details><summary>${i+1}. ${q.a===result.a[i]?'✓':'×'} ${names[q.s]}</summary><p>${q.t}</p><p>Correta: ${q.o[q.a]}. ${q.c}</p></details>`).join('')}${btn('Novo simulado','start()')}`}h+='</section>'}if(tab===7)h=`<section><h2>Backup</h2><p>O progresso é salvo neste navegador quando o armazenamento local está disponível. Exporte uma cópia para não perder dados.</p><textarea id=b rows=6></textarea><p>${btn('Gerar backup',"document.querySelector('#b').value=JSON.stringify(st)")} ${btn('Restaurar',"restore()")}</p></section>`;view.innerHTML=h}function restore(){try{let x=JSON.parse(document.querySelector('#b').value);if(!Array.isArray(x.h)||x.h.length!==7||!Array.isArray(x.logs))throw 0;st=x;save();render()}catch{alert('Backup inválido')}}render();
</script></html>
