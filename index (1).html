<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRF Estudos 5.0</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#183047;margin:0}main{max-width:850px;margin:auto;padding:16px}header{background:#17324d;color:white;padding:24px;border-radius:16px}h1{margin:5px 0}small{color:inherit}nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}button,input,select{font:inherit;padding:10px;border:1px solid #aab8c5;border-radius:8px;background:white;color:#183047}button{cursor:pointer}button.active,.primary{background:#17324d;color:white}section{background:white;padding:18px;border-radius:12px;margin:12px 0}p{line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ddd;flex-wrap:wrap}input[type=number]{width:85px}.choice{display:block;width:100%;text-align:left;margin:7px 0}.good{background:#d5f0df}.bad{background:#f9d9d9}a{color:#185b91}progress{width:100%}textarea{width:100%}body{background:#edf2f8}header{background:linear-gradient(120deg,#142c46,#285d83);box-shadow:0 8px 24px #17324d22}section{box-shadow:0 3px 16px #17324d0c}nav{position:sticky;top:0;background:#edf2f8;padding:8px 0;z-index:2}button{font-weight:550}body.dark{background:#101925;color:#e5edf7}body.dark section,body.dark nav{background:#1c2a3b}body.dark button,body.dark input,body.dark select,body.dark textarea{background:#26384c;color:#e5edf7;border-color:#52647a}body.dark a{color:#a5d4ff}body.dark .active,body.dark .primary{background:#376e9e}body.dark .good{background:#20553d}body.dark .bad{background:#713d40}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar button{padding:8px 0;min-width:0}.calendar small{text-align:center}.timer{font-size:26px;font-variant-numeric:tabular-nums;font-weight:bold}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metrics div{border:1 const facts=raw.map(x=>x.split('\n').map(y=>y.split('|')));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);let bank=[];function add(s,t,a,w,c){let o=shuffle([a,...w]);bank.push({id:bank.length,s,t,o,a:o.indexOf(a),c})}facts.forEach((f,s)=>{if(s===2)return;let n=s===0?10:5;f.forEach(([d,a,c],i)=>{for(let k=0;k<n;k++){let rev=k%2,other=f.filter((_,j)=>i!==j),v=shuffle(other).slice(0,4);add(s,rev?`Qual descrição corresponde a ${a}?`:`${['Identifique','Associe','Reconheça','Classifique','Indique'][Math.floor(k/2)]}: ${d}`,rev?d:a,v.map(x=>x[rev?0:1]),c)}})});for(let i=0;i<50;i++){let n=i+3,a=n*4,b=n*3,c=n,r=a+b-c;add(2,`Em uma turma, ${a} estudam Português, ${b} Lógica e ${c} ambas. Quantos estudam pelo menos uma?`,String(r),[r-1,r+1,a+b,a+b+c].map(String),`${a}+${b}−${c}=${r}. Subtraia a interseção para não contar duas vezes.`)}
const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];let st={h:[1,1,1,1,1,1,0],plan:[60,60,60,60,60,60,0],actual:[0,0,0,0,0,0,0],status:Array(7).fill('future'),done:{},logs:[],carry:[],schedule:null};try{Object.assign(st,JSON.parse(localStorage.getItem('prf4')||'{}'))}catch{}function save(){try{localStorage.setItem('prf4',JSON.stringify(st))}catch{}}let tab=0,s=0,k=0,level=0,flip=false,answer=null,exam=null,result=null,miss=false;const tabs=['Início','Cronograma','Aulas','Flashcards','Questões','Simulado','Erros','Backup','Calendário','Revisões','Relatórios','Provas reais'];const view=document.querySelector('#view');const btn=(t,code,cl='')=>`<button class="${cl}" onclick="${code}">${t}</button>`;const sel=()=>`<select onchange="s=+this.value;k=0;answer=null;flip=false;render()">${names.map((n,i)=>`<option value=${i} ${i===s?'selected':''}>${n}</option>`).join('')}</select>`;const sum=a=>a.reduce((x,y)=>x+y,0);function replan(){let queue=st.carry.slice(),cycle=[0,2,4,3,0,5,6,7,8,1],j=0;let orig=st.plan.map(m=>{let a=[];while(m>0){let t=Math.min(m,30);a.push({s:cycle[j++%cycle.length],m:t});m-=t}return a});orig.forEach((a,i)=>{if(st.status[i]==='future')return;let n=st.status[i]==='missed'?0:st.actual[i];a.forEach(b=>{let t=Math.min(n,b.m);n-=t;if(b.m>t)queue.push({...b,m:b.m-t})})});orig.forEach((a,i)=>{if(st.status[i]==='future')queue.push(...a)});st.schedule=days.map((_,i)=>{let a=[],cap=st.status[i]==='future'?Math.round(st.h[i]*60):0;while(cap&&queue.length){let b=queue[0],m=Math.min(cap,b.m);a.push({...b,m});cap-=m;queue[0]={...b,m:b.m-m};if(!queue[0].m)queue.shift()}return a});st.remaining=queue;save();render()}
function record(q,a){st.logs.push({id:q.id,s:q.s,ok:q.a===a,date:dateKey(new Date())});save()}function pool(){return bank.filter(q=>q.s===s&&(!miss||st.logs.filter(l=>l.id===q.id).at(-1)?.ok===false))}function choices(q,a,ex){return q.o.map((o,i)=>btn('ABCDE'[i]+') '+o,ex?`exam.a[exam.pos]=${i};render()`:`respond(${i})`,'choice '+(ex?(a===i?'active':''):a===null?'':i===q.a?'good':i===a?'bad':''))).join('')}function respond(i){if(answer!==null)return;let q=pool()[k];answer=i;record(q,i);if(miss&&i===q.a){miss=false;k=pool().findIndex(x=>x.id===q.id)}render()}function start(){let q=names.flatMap((_,i)=>shuffle(bank.filter(x=>x.s===i)).slice(0,i===0?12:6));exam={q,a:q.map(()=>null),pos:0,start:Date.now()};result=null;render()}function finish(auto=false){if(!auto&&!confirm('Entregar simulado?'))return;result=exam;exam.q.forEach((q,i)=>record(q,exam.a[i]));exam=null;render()}
function render(){document.querySelector('#nav').innerHTML=tabs.map((t,i)=>btn(t,`tab=${i};k=0;answer=null;miss=${i===6};render()`,tab===i?'active':'')).join('');let h='';if(tab===0)h=`<section><h2>Seu progresso</h2><p>${sum(st.h)} horas semanais · ${bank.length} exercícios gerados</p><p>${st.logs.length} respostas · ${st.logs.length?Math.round(st.logs.filter(x=>x.ok).length/st.logs.length*100):0}% de acertos</p>${btn('Estudar agora','tab=2;render()','primary')} ${btn('Replanejar','tab=1;render()')}</section><section><h3>Desempenho</h3>${names.map((n,i)=>{let l=st.logs.filter(x=>x.s===i);return `<p>${n}: ${l.filter(x=>x.ok).length}/${l.length}</p><progress max=1 value=${l.length?l.filter(x=>x.ok).length/l.length:0}></progress>`}).join('')}</section>`;if(tab===1)h=`<section><h2>Disponibilidade e frequência</h2>${days.map((d,i)=>`<div class=row><b>${d}</b><label>Horas <input type=number min=0 max=16 step=.25 value=${st.h[i]} onchange="st.h[${i}]=Math.max(0,Math.min(16,+this.value||0));save()"></label><select onchange="st.status[${i}]=this.value;if(this.value==='done')st.actual[${i}]=st.plan[${i}];save();render()">${[['future','A estudar'],['done','Concluído'],['partial','Parcial'],['missed','Não estudei']].map(([v,t])=>`<option value=${v} ${st.status[i]===v?'selected':''}>${t}</option>`).join('')}</select>${['done','partial'].includes(st.status[i])?`<label>Minutos estudados <input type=number min=0 value=${st.actual[i]} onchange="st.actual[${i}]=Math.max(0,+this.value||0);save()"></label>`:''}</div>`).join('')}<p>${btn('↻ Replanejar estudos','replan()','primary')}</p>${btn('Definir nova meta semanal','if(confirm(\'Alterar meta original para as horas disponíveis?\')){st.plan=st.h.map(h=>Math.round(h*60));replan()}')}</section>${st.schedule?`<section><h3>Plano recalculado</h3>${days.map((d,i)=>`<h4>${d}</h4>${st.schedule[i].map(b=>`<div class=row>${names[b.s]} <b>${b.m} min</b></div>`).join('')||'Sem atividades futuras'}`).join('')}<p>Pendência: ${sum((st.remaining||[]).map(b=>b.m))} min</p></section>`:''}`;if(tab===2){let f=facts[s][k%facts[s].length];h=`<section><h2>Aulas e resumos</h2>${sel()}<p><select onchange="k=+this.value;render()">${facts[s].map((x,i)=>`<option value=${i} ${k===i?'selected':''}>${x[0]}</option>`).join('')}</select></p>${['Básico','Intermediário','Avançado'].map((x,i)=>btn(x,`level=${i};render()`,level===i?'active':'')).join(' ')}<h3>${f[0]}</h3><p><b>${f[1]}</b> — ${f[2]}</p><p>${['Identifique o conceito e explique com suas palavras.','Compare este conceito com os demais da disciplina e resolva exercícios de fixação.','Aplique o conceito a questões contextualizadas e confira as exceções nas fontes oficiais.'][level]}</p>${btn(st.done[s+'-'+k+'-'+level]?'Concluído ✓':'Concluir etapa',`completeLesson('${s}-${k}-${level}')`)}<h3>Materiais complementares</h3><p><a target=_blank href="https://www.youtube.com/results?search_query=${encodeURIComponent(names[s]+' '+f[0]+' concurso aula completa')}">Buscar videoaulas</a></p><p><a target=_blank href="https://www.google.com/search?q=${encodeURIComponent(names[s]+' '+f[0]+' apostila PDF site:gov.br')}">Buscar apostilas públicas</a></p><p><a href="https://www.escolavirtual.gov.br/catalogo">Escola Virtual de Governo</a></p><small>Etapas compactas, não aulas extensivas. Links de busca não são curadoria individual.</small></section>`}if(tab===3){let f=facts[s][k%facts[s].length];h=`<section><h2>Flashcards</h2>${sel()}<p>${k+1}/${facts[s].length}</p><button style="width:100%;min-height:150px;font-size:22px" onclick="flip=!flip;render()">${flip?f[1]+' — '+f[2]:f[0]}<br><small>Toque para virar</small></button><p>${btn('Próximo',`k=(k+1)%facts[s].length;flip=false;render()`)}</p></section>`}if(tab===4||tab===6){let p=pool(),q=p[k];h=`<section><h2>${miss?'Caderno de erros':'Questões comentadas'}</h2>${sel()}<p>${p.length} exercícios disponíveis</p>${q?`<small>${k+1}/${p.length}</small><h3>${q.t}</h3>${choices(q,answer,false)}${answer!==null?`<p><b>${answer===q.a?'Correto!':'Resposta correta: '+q.o[q.a]}</b><br>${q.c}</p>`:''}${btn('Próxima',`k=(k+1)%${p.length};answer=null;render()`,'primary')}`:'Nenhum exercício neste filtro.'}</section>`}if(tab===5){h='<section><h2>Simulado de 60 questões</h2>';if(!exam&&!result)h+=`<p>Modelo provisório: 12 de Português e 6 de cada outra disciplina. Confira a distribuição oficial antes de usar como réplica da prova.</p>${btn('Iniciar','start()','primary')}`;if(exam){let q=exam.q[exam.pos];h+=`<p id=examclock></p><p>${exam.pos+1}/60 · ${names[q.s]}</p><h3>${q.t}</h3>${choices(q,exam.a[exam.pos],true)}${btn('Anterior','exam.pos=Math.max(0,exam.pos-1);render()')} ${btn('Próxima','exam.pos=Math.min(59,exam.pos+1);render()')}<p>${exam.a.map((a,i)=>btn(i+1,`exam.pos=${i};render()`,a!==null?'active':'')).join(' ')}</p>${btn('Entregar','finish()','primary')}`}if(result){let a=result.q.filter((q,i)=>q.a===result.a[i]).length;h+=`<h3>${a}/60 acertos</h3>${result.q.map((q,i)=>`<details><summary>${i+1}. ${q.a===result.a[i]?'✓':'×'} ${names[q.s]}</summary><p>${q.t}</p><p>Correta: ${q.o[q.a]}. ${q.c}</p></details>`).join('')}${btn('Novo simulado','start()')}`}h+='</section>'}if(tab===7)h=`<section><h2>Backup</h2><p>O progresso é salvo neste navegador quando o armazenamento local está disponível. Exporte uma cópia para não perder dados.</p><textarea id=b rows=6></textarea><p>${btn('Gerar backup',"document.querySelector('#b').value=JSON.stringify(st)")} ${btn('Restaurar',"restore()")}</p></section>`;if(tab===8)h=calendarView();if(tab===9)h=reviewView();if(tab===10)h=reportView();if(tab===11)h=realView();if(tab===2)h+=deepView();if(tab===0)h+=goalView();view.innerHTML=h;tick()}function restore(){try{let x=JSON.parse(document.querySelector('#b').value);if(!Array.isArray(x.h)||x.h.length!==7||!Array.isArray(x.logs))throw 0;st=x;save();render()}catch{alert('Backup inválido')}}
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
st.sessions=st.sessions||{};st.reviews=st.reviews||{};st.dailyGoal=st.dailyGoal??60;st.weekGoal=st.weekGoal??360;st.dark=!!st.dark;document.body.classList.toggle('dark',st.dark);let running=0,month=new Date(),selected=dateKey(new Date());

function tick(){document.querySelector('#clock').textContent=duration(running?Math.floor((Date.now()-running)/1000):0);if(exam){let left=Math.max(0,12600-Math.floor((Date.now()-exam.start)/1000));let el=document.querySelector('#examclock');if(el)el.textContent='Tempo restante: '+duration(left);if(!left)finish(true)}}setInterval(tick,1000);
function completeLesson(key){st.done[key]=true;if(!st.reviews[key])st.reviews[key]={start:Date.now(),done:[]};save();render()}
function goalView(){let now=new Date(),today=st.sessions[dateKey(now)]||0;let monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);let weekly=Object.entries(st.sessions).filter(([k])=>k>=dateKey(monday)&&k<=dateKey(now)).reduce((a,[k,v])=>a+v,0);return `<section><h2>Metas de estudo</h2><label>Diária (min) <input type=number min=0 value=${st.dailyGoal} onchange="st.dailyGoal=Math.max(0,+this.value||0);save();render()"></label><p>${Math.floor(today/60)} / ${st.dailyGoal} min</p><progress max=${st.dailyGoal||1} value=${today/60}></progress><p><label>Semanal (min) <input type=number min=0 value=${st.weekGoal} onchange="st.weekGoal=Math.max(0,+this.value||0);save();render()"></label></p><p>${Math.floor(weekly/60)} / ${st.weekGoal} min</p><progress max=${st.weekGoal||1} value=${weekly/60}></progress></section>`}
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();return `<section><h2>Calendário de estudos</h2>${btn('‹','month=new Date(month.getFullYear(),month.getMonth()-1,1);render()')} ${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})} ${btn('›','month=new Date(month.getFullYear(),month.getMonth()+1,1);render()')}<div class=calendar>${['S','T','Q','Q','S','S','D'].map(d=>`<small>${d}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:n},(_,i)=>{let k=dateKey(new Date(y,m,i+1));return btn((i+1)+(st.sessions[k]?' •':''),`selected='${k}';render()`,selected===k?'active':'')}).join('')}</div><h3>${selected}</h3><p>${Math.floor((st.sessions[selected]||0)/60)} minutos registrados</p><label>Registrar total manual (min) <input type=number min=0 value=${Math.floor((st.sessions[selected]||0)/60)} onchange="st.sessions[selected]=Math.max(0,+this.value||0)*60;save();render()"></label></section>`}
function reviewView(){let rows=Object.entries(st.reviews).flatMap(([k,v])=>[1,7,30].filter(d=>!v.done.includes(d)).map(d=>({k,d,time:v.start+d*86400000}))).sort((a,b)=>a.time-b.time);return `<section><h2>Revisões espaçadas</h2><p>Agendadas ao concluir uma etapa. Consulte esta aba diariamente.</p>${rows.map(r=>{let [i,j,l]=r.k.split('-').map(Number);return `<div class=row><span>${names[i]} · ${facts[i][j]?.[0]||'Aula'}<br><small>${r.d} dias · ${new Date(r.time).toLocaleDateString('pt-BR')} ${r.time<=Date.now()?'· Pendente':''}</small></span>${btn('Revisar',`s=${i};k=${j};level=${l};tab=2;render()`)}${btn('Feito',`st.reviews['${r.k}'].done.push(${r.d});save();render()`)}</div>`}).join('')||'Nenhuma revisão agendada.'}</section>`}
function reportView(){return `<section><h2>Desempenho por assunto</h2>${names.map((n,i)=>`<details><summary>${n}</summary>${facts[i].map((f,j)=>{let ids=bank.filter(q=>q.s===i&&(i===2?false:Math.floor((q.id-bank.find(b=>b.s===i).id)/(i===0?10:5))===j)).map(q=>q.id);let l=st.logs.filter(a=>ids.includes(a.id)),a=l.filter(a=>a.ok).length;return `<div class=row>${f[0]} <b>${l.length?a+'/'+l.length:'Sem respostas'}</b></div>`}).join('')}${i===2?`<p>União de conjuntos: ${st.logs.filter(a=>a.s===2&&a.ok).length}/${st.logs.filter(a=>a.s===2).length}</p>`:''}</details>`).join('')}</section>`}
function realView(){return `<section><h2>Provas anteriores</h2><p>Questões reais e comentários disponíveis nos portais externos (alguns exigem conta). O banco interno continua autoral.</p><p><a href="https://www.qconcursos.com/questoes-de-concursos/provas/funcab-2014-prf-agente-administrativo-01" target=_blank>PRF Administrativo 2014 — questões</a></p><p><a href="https://www.tecconcursos.com.br/" target=_blank>TEC Concursos — buscar provas e comentários</a></p></section>`}
const deep=[['Leia o período inteiro antes de classificar o conectivo. Compare “Embora chova, sairei” (concessão) com “Se chover, ficarei” (condição). Na crase, verifique simultaneamente a regência e o artigo: vou à escola, mas vou a pé.','Em “Embora estivesse cansada, estudou”, o cansaço impediu o estudo?','Não. A oração expressa concessão.'],['A ética pública exige mais que cumprir formalidades: o atendimento deve ser respeitoso e impessoal. A comissão de ética e a autoridade disciplinar possuem competências distintas.','Um amigo pede prioridade sem previsão legal. Deve receber?','Não. O favorecimento viola a impessoalidade.'],['Uma proposição pode ser verdadeira ou falsa. Para P e Q, somente VV produz V. Para P ou Q, somente FF produz F. Na condicional, somente VF produz F. Negar “todos estudam” exige apenas um contraexemplo. Em conjuntos, some os grupos e subtraia a interseção.','20 estudam português, 15 lógica e 5 ambas. Quantos estudam pelo menos uma?','20 + 15 − 5 = 30.'],['A Constituição distingue autonomia dos entes e soberania da República. Os remédios constitucionais protegem direitos específicos: HC para locomoção, HD para dados pessoais e MS para direito líquido e certo nos requisitos legais.','Qual remédio protege contra prisão ilegal?','Habeas corpus.'],['A administração direta reúne órgãos; a indireta reúne entidades. Desconcentração ocorre internamente, descentralização envolve outra pessoa. Anulação decorre de ilegalidade; revogação, do mérito de ato válido, quando cabível.','Um ato ilegal deve ser revogado por conveniência?','Não. A ilegalidade fundamenta a anulação.'],['PODC organiza o ciclo de gestão: planejamento fixa objetivos, organização distribui recursos, direção orienta pessoas e controle compara resultados. Eficiência mede uso de recursos, eficácia mede metas e efetividade mede impacto.','Uma equipe atingiu a meta gastando recursos excessivos. Foi eficaz?','Sim quanto à meta, mas pode ter sido ineficiente.'],['O ciclo documental distingue arquivos corrente, intermediário e permanente. A tabela de temporalidade orienta guarda e destinação; a digitalização não autoriza automaticamente eliminar originais.','Qual instrumento define prazos de guarda?','Tabela de temporalidade.'],['Confidencialidade protege acesso, integridade protege contra alterações indevidas e disponibilidade garante acesso quando necessário. HTTPS protege o transporte, não a honestidade do site.','Uma mensagem falsa solicita sua senha. Qual ameaça?','Phishing.'],['O art. 144, §2º da Constituição define a PRF como órgão permanente mantido pela União, destinado ao patrulhamento ostensivo das rodovias federais. O cargo administrativo é distinto da carreira policial.','Qual ente mantém a PRF?','União.']];
